name: install proof

# Proves the install path on a fresh GitHub virtual machine. mise installs a release, its
# build provenance verifies, `bas broker install` sets up the broker, a second run changes
# nothing, and `bas doctor --broker` exits 0. A software passkey stands in for a security
# key. The machine account in BAS_PROOF_TOKEN can write to one project, BAS_PROOF_PROJECT,
# which holds nothing but this proof's signing key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to prove, such as 0.9.0
        required: true

permissions:
  contents: read
  attestations: read

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      ORIGIN: https://bas.proof.example
      PROJECT: ${{ vars.BAS_PROOF_PROJECT }}
      KEY_NAME: install-proof-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bas with mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          ~/.local/bin/mise use -g "github:bjoernaagaard/bas@$VERSION"
          dirname "$(~/.local/bin/mise which bas)" >> "$GITHUB_PATH"
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bas --version
          mkdir "$RUNNER_TEMP/release"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p bas-Linux-X64.tar.gz -D "$RUNNER_TEMP/release"
          gh attestation verify "$RUNNER_TEMP/release/bas-Linux-X64.tar.gz" -R "$GITHUB_REPOSITORY"
          tar -xzf "$RUNNER_TEMP/release/bas-Linux-X64.tar.gz" -C "$RUNNER_TEMP/release"
          cmp "$RUNNER_TEMP/release/bas" "$(command -v bas)"
      - name: Install the broker
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BAS_PROOF_TOKEN }}
        run: |
          set -euo pipefail
          bas auth login --profile proof --from-env
          organization="$(bas auth list | sed -n 's/^proof .*organization=\([0-9a-f-]*\).*/\1/p')"
          sudo "$(command -v bas)" broker install --dry-run \
            --organization "$organization" --project "$PROJECT" --origin "$ORIGIN"
          # systemd-ask-password reads the token from a terminal, so `script` gives it one.
          printf '%s\n' "$BWS_ACCESS_TOKEN" | script -qec "stty -echo; sudo $(command -v bas) broker install \
            --organization $organization --project $PROJECT --origin $ORIGIN" /dev/null
          systemctl is-active bas-broker
      - name: Run the install again
        run: |
          set -euo pipefail
          sudo "$(command -v bas)" broker install | tee "$RUNNER_TEMP/again.txt"
          grep -qx "Nothing to change." "$RUNNER_TEMP/again.txt"
      - name: Enroll a passkey and approve a policy
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BAS_PROOF_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          passkey="$GITHUB_WORKSPACE/.github/install-proof/passkey.py"
          python3 "$passkey" enroll "$(sudo cat /var/lib/bas/enroll-url)"
          found() { bas find --profile proof --project "$PROJECT" "$KEY_NAME" --json | jq -r '.matches[0].reference // empty'; }
          if [ -z "$(found)" ]; then
            ssh-keygen -q -t ed25519 -N '' -C install-proof -f signing-key
            bas create --profile proof --key "$KEY_NAME" --project "$PROJECT" --stdin < signing-key > /dev/null
            rm signing-key signing-key.pub
          fi
          reference="$(found)"
          install -d -m 0700 ~/.config/bas
          (umask 077; printf 'version = 1\n\n[ssh.git_signing]\nref = "bas://home/%s"\nuse = ["sign-git"]\n' "${reference##*/}" > ~/.config/bas/policy.toml)
          EDITOR=true bas policy edit > policy-edit.txt &
          until grep -q 'https://' policy-edit.txt; do sleep 1; done
          python3 "$passkey" approve "$(grep -o 'https://[^ ]*' policy-edit.txt)"
          wait
          cat policy-edit.txt
          bas policy show
      - name: Check with bas doctor
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          SSH_AUTH_SOCK=/run/bas/ssh-agent.sock ssh-add -L | grep 'bas:git_signing' > ~/.ssh/git_signing.pub
          echo "proof@example.com $(cut -d' ' -f1,2 ~/.ssh/git_signing.pub)" > ~/.ssh/allowed_signers
          git config --global user.name "install proof"
          git config --global user.email proof@example.com
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/git_signing.pub
          git config --global gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers
          bas doctor --broker
          bas audit --since 10m
