name: ci

on:
  pull_request:
  # Pushes to main fill the caches that pull requests and release tags restore.
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      MACOS_SIGNING_IDENTITY:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          cargo deny check advisories 2>&1 | tee dependency-evidence/advisories.log
      - name: Record dependency trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          cargo tree --locked > dependency-evidence/dependency-trees.txt
          for package in zbus zbus_names zvariant zvariant_derive; do
            if cargo tree --locked --target all -i "$package" >> dependency-evidence/dependency-trees.txt 2>&1; then
              echo "unexpected dependency: $package" | tee -a dependency-evidence/dependency-trees.txt
              exit 1
            fi
          done
          cargo metadata --locked --format-version 1 > dependency-evidence/metadata.json
          jq -r '.packages[] | select(.name == "rsa") | "rsa@" + .version' \
            dependency-evidence/metadata.json > dependency-evidence/rsa-versions.txt
          while IFS= read -r package; do
            cargo tree --locked --target all -i "$package" >> dependency-evidence/dependency-trees.txt
          done < dependency-evidence/rsa-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: dependency-evidence/
          if-no-files-found: error

  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build Linux only. Pushes to main, releases, and manual runs build every OS.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps
      - name: Build release executables
        run: cargo build --locked --release --bin bas --example e2e
      # The keychain lets a program read its own items without asking only while its
      # signature names the same identity. An unsigned build is named by its hash, which
      # changes with every release. One certificate for every release keeps the name.
      - name: Sign the macOS executable
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          identity="$RUNNER_TEMP/identity.pem"
          printf '%s\n' "$MACOS_SIGNING_IDENTITY" > "$identity"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$identity" -k "$keychain" -T /usr/bin/codesign
          rm "$identity"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          leaf="$(security find-certificate -Z "$keychain" | awk '/SHA-1/ { print $NF }')"
          codesign --force --sign "$leaf" --keychain "$keychain" --identifier dev.bas target/release/bas
          security delete-keychain "$keychain"
          codesign --verify --strict target/release/bas
          codesign -d -r- target/release/bas 2>&1 |
            grep -F 'designated => identifier "dev.bas" and certificate leaf = H"'
      - name: Package and check the extracted executable
        env:
          BUILD_OS: ${{ runner.os }}
          BUILD_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          binary=bas
          e2e_binary=e2e
          root="$PWD"
          if [[ "$BUILD_OS" == Windows ]]; then
            binary=bas.exe
            e2e_binary=e2e.exe
            root="$(cygpath -w "$PWD")"
          fi
          archive="bas-${BUILD_OS}-${BUILD_ARCH}.tar.gz"
          evidence="e2e-${BUILD_OS}-${BUILD_ARCH}"
          mkdir package extracted
          cp "target/release/$binary" package/
          cp README.md package/
          if [[ "$BUILD_OS" == Linux ]]; then
            mkdir -p package/contrib
            cp -R contrib/linux package/contrib/
            cp contrib/policy.toml.example package/contrib/
          elif [[ "$BUILD_OS" == macOS ]]; then
            mkdir -p package/contrib
            cp -R contrib/macos package/contrib/
            cp contrib/policy.toml.example package/contrib/
            plutil -lint contrib/macos/*.plist
            # The broker runs as _bas from a root-owned file. A library from a
            # user-owned prefix, such as Homebrew's, would let that user run code in it.
            if otool -L "target/release/$binary" | grep -E '/(opt/homebrew|usr/local)/'; then
              echo "bas links a library outside the system" >&2
              exit 1
            fi
          fi
          tar -czf "$archive" -C package .
          tar -xzf "$archive" -C extracted
          cmp "target/release/$binary" "extracted/$binary"
          "extracted/$binary" tui --help
          "target/release/examples/$e2e_binary" offline \
            --bas "$root/extracted/$binary" \
            --artifacts "$root/$evidence" \
            --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ runner.os }}-${{ runner.arch }}
          path: e2e-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bas-${{ runner.os }}-${{ runner.arch }}
          path: bas-*.tar.gz
          if-no-files-found: error

  msrv:
    name: cargo check (minimum Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install minimum Rust
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 check --locked --all-targets
